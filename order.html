<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — FRESH &amp; WHITE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Fresh &amp; White</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__head">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="divider" style="margin-left:auto;margin-right:auto;">
          <p class="lead">กรอกข้อมูลให้ครบถ้วน แล้วกดยืนยันสั่งซื้อ เราจะติดต่อกลับเพื่อยืนยันรายการ</p>
        </div>

        <form id="orderForm" class="form">
          <div class="form__group">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" autocomplete="name" required>
          </div>

          <div class="form__group">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์หรือ Line ID" autocomplete="tel" required>
          </div>

          <div class="form__group">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" placeholder="รายการสินค้าที่ต้องการสั่งซื้อ" required></textarea>
          </div>

          <div class="form__group">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="decimal" placeholder="0" required>
          </div>

          <div class="form__group">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3" placeholder="ที่อยู่จัดส่งหรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
          </div>

          <button type="submit" class="btn btn--block">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Fresh &amp; White</span>
      <p>สร้างรอยยิ้มมั่นใจ ด้วยพลังธรรมชาติและการดูแลที่เหนือกว่า</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
